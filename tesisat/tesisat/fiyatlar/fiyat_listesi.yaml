# =====================================================================
#  FİYAT LİSTESİ — yangın tesisatı (KDV hariç birim fiyatlar)
#  Kaynak: kullanıcının "T12 Mezanin Sprinkler — Maliyet ve Teklif Hesabı"
#  çalışma kitabı (Teklif + Piyasa fiyatları sayfaları), 18.11.2026.
#  Proje ayar dosyasındaki `fiyat:` bölümü bu listeyi ezer / genişletir.
#
#  Fiyat türleri:
#   ÇŞB    → birim fiyat = ref × guncelleme × (1 − iskonto)
#            (Bakanlık pozları kâr + genel gider dahil yayımlanır → GG/kâr EKLENMEZ)
#   Tahmin → birim fiyat = tahmin × (1 + genel_gider) × (1 + kar)
#   Net    → birim fiyat = net (olduğu gibi)
#  Eşleşme: önce `kod` (tam), sonra `desen` (joker) + isteğe bağlı dn_min/dn_max.
#  Listede olmayan kalem teklifte "fiyat yok" olarak kalır (UYDURULMAZ).
# =====================================================================
parametreler:
  guncelleme: 1.25        # ÇŞB Ara-2025 → bugün (kullanıcı tahmini, Teklif!B3)
  iskonto: 0.15           # Bakanlık fiyatına piyasa iskontosu (Teklif!B7)
  genel_gider: 0.10       # Teklif!B4
  kar: 0.15               # Teklif!B5
  kdv: 0.20               # Teklif!B6
  tarih: 2026-11-18
  kaynak: "T12 teklif dosyası (kullanıcı), 18.11.2026"

kalemler:
